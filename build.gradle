import java.util.stream.Stream

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        //classpath("com.guardsquare:proguard-gradle:7.8.1")
    }
}

plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
    id "com.gradleup.shadow" version "9.4.1" apply false
}

version = project.mod_version
def buildVersion = getPNBVersion()
group = project.maven_group

apply plugin: "com.gradleup.shadow"

base {
    archivesName = project.archives_base_name
}

configurations {
    shadowCommon
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tcm" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven {
        name 'IzzelAliz Maven'
        url 'https://maven.izzel.io/releases/'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // If you are on Fabric, uncomment this.
    maven {
        url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content {
            includeGroup 'fuzs.forgeconfigapiport'
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //classpath 'net.sf.proguard:proguard-gradle:6.0.3'

    //modImplementation("maven.modrinth:minecraft-transit-railway:FABRIC-4.0.4+1.20.1")
    //implementation files("checkouts/jcm.jar")
    //modImplementation("maven.modrinth:jcm:v2.2.0+1.20.1")
    modImplementation files("checkouts/mtr.jar")

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:11.1.136");
    modImplementation("com.terraformersmc:modmenu:7.2.2")
    //include(modImplementation("me.lucko:fabric-permissions-api:0.3.1"))
    //modImplementation(files("includeMods/mishanguc-1.5.3-1.20.1.jar"))
    modImplementation("maven.modrinth:mishang-urban-construction:1.6.0-1.20.1")

    // If you are on Fabric, uncomment this and find a compatible FCAPI version.
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3"
    implementation "icyllis.modernui:ModernUI-Core:${modernui_version}"
    // Modern UI core extensions
    // Markdown (<=3.11.1) / Markflow (>=3.12.0) is required, others are optional
    implementation "icyllis.modernui:ModernUI-Markflow:${modernui_version}"
    // Choose one of Fabric or NeoForge
    modImplementation("icyllis.modernui:ModernUI-Fabric:${minecraft_version}-${modernui_version}.1")
    //modImplementation(files("includeMods/ModernUI-Fabric-1.20.4-3.12.0.1-universal.jar"))

    implementation "javax.annotation:javax.annotation-api:1.3.2"
    compileOnly "com.google.code.findbugs:jsr305:+"

    //compileOnly "com.guardsquare:proguard-gradle:7.8.1"

    implementation "org.eclipse.jetty:jetty-http:11.0.25"
    implementation "org.eclipse.jetty:jetty-io:11.0.25"
    implementation "org.eclipse.jetty:jetty-server:11.0.25"
    implementation "org.eclipse.jetty:jetty-servlet:11.0.25"
    implementation "org.eclipse.jetty:jetty-util:11.0.25"
    implementation "org.eclipse.jetty:jetty-util-ajax:11.0.25"
    implementation "org.eclipse.jetty:jetty-security:11.0.25"
    implementation "javax.servlet:servlet-api:3.0-alpha-1"
    implementation "jakarta.servlet:jakarta.servlet-api:6.0.0"
    implementation "org.apache.httpcomponents.client5:httpclient5:5.5"
    implementation "commons-io:commons-io:2.13.0"

    shadowCommon "org.eclipse.jetty:jetty-http:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-io:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-server:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-servlet:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-util:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-util-ajax:11.0.25"
    shadowCommon "org.eclipse.jetty:jetty-security:11.0.25"
    shadowCommon "javax.servlet:servlet-api:3.0-alpha-1"
    shadowCommon "jakarta.servlet:jakarta.servlet-api:6.0.0"
    shadowCommon "commons-io:commons-io:2.13.0"
}

/*mixin {
    debug = true
    dumpTargetOnFailure = true
}*/

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.register("addPNBVersion") {
    FileWriter s = new FileWriter(new File("./src/main/resources/pnb.txt"))
    buildVersion = String.valueOf(++Integer.valueOf(buildVersion))
    s.write(buildVersion)
    s.flush()
    s.close()
}

String getPNBVersion() {
    FileInputStream s = new FileInputStream(new File("./src/main/resources/pnb.txt"))
    var l = s.readLines()
    s.close()
    println "Current build version: " + l.get(0)
    return l.get(0)
}

build {
    dependsOn addPNBVersion
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

